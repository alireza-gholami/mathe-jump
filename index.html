<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-Jump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- Spieler-Leiste oben -->
    <div class="player-bar">
      <div class="player-info">
        👤 Spieler: <input type="text" id="playerNameInput" placeholder="Dein Name..." maxlength="15">
        <button id="savePlayerBtn" class="small-btn">Laden / Speichern</button>
      </div>
      <span id="savedBadge" class="badge">Fortschritt: Level 1</span>
    </div>

    <header>
      <h1 id="level-title">Level 1</h1>
      <p id="level-hint">Hinweis lädt...</p>
    </header>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="controls">
      <div class="input-group">
        <label for="formula">y =</label>
        <input type="text" id="formula" placeholder="z.B. x + 1 oder -0.5*x^2 + 3" autocomplete="off">
      </div>
      <button id="jumpBtn">Springen! 🚀</button>
      <button id="nextBtn" class="hidden">Nächstes Level ➡️</button>
    </div>

    <p id="status-msg"></p>
  </div>

  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
